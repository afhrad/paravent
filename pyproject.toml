[project]
name = "paravent"
version = "0.1.184"
description = "D&D 5e tool for players and dungeon masters"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "htpy>=25.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.1",
    "python-multipart>=0.0.12",
    "watchfiles>=0.24",
    "pyyaml>=6.0.3",
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
    "anthropic>=2.0.0",
    "mcp>=2.3",
    "pillow>=11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
# The design reference ships generator scripts whose long lines are embedded HTML,
# not Python. Reformatting them would corrupt the pages they emit.
extend-exclude = ["design-reference", "data/reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

# python-jose ships no type information.
[[tool.mypy.overrides]]
module = ["jose", "jose.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Each test its own event loop, said explicitly: pytest-asyncio warns until it is set.
asyncio_default_fixture_loop_scope = "function"
