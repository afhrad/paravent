<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <filter id="mottle" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".011" numOctaves="4" seed="7" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 .42  0 0 0 0 .28  0 0 0 0 .09  .4 0 0 0 -.15"/>
  </filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="3" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 .3  0 0 0 0 .2  0 0 0 0 .08  .16 0 0 0 -.04"/>
  </filter>
  <rect width="512" height="512" filter="url(#mottle)"/>
  <rect width="512" height="512" filter="url(#grain)"/>
</svg>
